[project]
name = "cortex9-praktor-telegram-upload-path-escape-model"
version = "0.1.0"
description = "Offline, inert model of the praktor Telegram upload path-escape fix (CVE-2026-62331)"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905", "SIM110"]
